<style>
  :root {
    --void: #07070B;
    --surface: #12121A;
    --surface-2: #1A1A24;
    --line: rgba(38, 38, 47, 0.6);
    --silver: #ECEDF1;
    --muted: #71717F;
    --red: #E8242C;
    --red-deep: #5A0F14;
    --red-glow: rgba(232, 36, 44, 0.35);
    --gold: #d4af37;
    --gold-glow: rgba(212, 175, 55, 0.35);
    --cyan: #19f0f0;
    --cyan-glow: rgba(25, 240, 240, 0.35);
    --radius-lg: 20px;
    --radius-md: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background-color: #07070B;
    background: var(--void);
    color: var(--silver);
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
    overflow-x: hidden;
  }

  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1140px; margin: 0 auto; padding: 0 24px; }

  .mono {

    letter-spacing: 0.18em;

    color: var(--muted);
    display: inline-block;

  h1, h2, h3, h4 {

    font-weight: 600;

  }

    border-bottom: 1px solid var(--line);

  nav .wrap {

    height: 72px;
  }
  .logo-mark {

    align-items: center;
    gap: 10px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.05em;
  }
  .logo-dot {
    width: 8px;
    height: 8px;
    background: var(--red);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--red);
  }
  .nav-right { display: flex; align-items: center; gap: 32px; }
  .nav-links { display: flex; gap: 16px; align-items: center; }
  .nav-links a { font-size: 13px; color: var(--muted); transition: color 0.2s; }
  .nav-links a.nav-item:hover { color: var(--silver); }

  .lang-btn {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--line);
    color: var(--silver);
    padding: 6px 14px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
  }
  .lang-btn:hover { border-color: var(--red); box-shadow: 0 0 10px var(--red-glow); background: rgba(232, 36, 44, 0.05); }

  @media (max-width: 1050px) { .nav-links { display: none; } }

  /* ---------- HERO ---------- */
  .hero {
    position: relative;
    min-height: 85vh;
    display: flex;
    align-items: center;
    padding-top: 140px;
    padding-bottom: 40px;
    overflow: hidden;
  }
  .hero-grid {
    position: absolute;
    inset: 0;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    opacity: 0.15;
    mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
  }
  .hero-content { position: relative; z-index: 2; width: 100%; text-align: center; }
  .hero-banner { width: 100%; max-width: 800px; margin: 0 auto 30px; display: block; filter: drop-shadow(0 0 35px var(--red-glow)); height: auto; }
  .hero h1 { font-size: clamp(40px, 8vw, 80px); line-height: 1.1; margin-bottom: 20px; font-weight: 700; }
  .hero h1 .accent { color: var(--red); }
  .hero-sub { max-width: 600px; margin: 20px auto 0; color: #A6A6B3; font-size: 18px; }

  .hero-showcase {
    max-width: 850px;

    border: 1px solid var(--line);
    padding: 40px;

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }
  .showcase-title {
    font-size: 14px;
    color: var(--red);

    letter-spacing: 0.15em;
  }
  .showcase-desc {

  .section-head { margin-bottom: 35px; }
  .eco-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  @media (max-width: 860px) { .eco-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .eco-grid { grid-template-columns: 1fr; } }
  .eco-tile { background-color: #07070B; background: var(--void); padding: 30px; border-radius: var(--radius-md); border: 1px solid var(--line); transition: all 0.3s ease; display: flex; flex-direction: column; justify-content: space-between; min-height: 220px; }
  .eco-tile:hover { transform: translateY(-3px); border-color: rgba(232, 36, 44, 0.4); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
  .eco-tile.active { background: linear-gradient(160deg, var(--surface-2) 0%, var(--red-deep) 150%); border-color: rgba(232, 36, 44, 0.3); }

  .eco-tile h3 { font-size: 20px; line-height: 1.2; }
  .eco-status { font-family: 'JetBrains Mono'; font-size: 10px; border: 1px solid var(--line); padding: 4px 12px; border-radius: 50px; text-align: center; width: fit-content; }

  /* ---------- VIORA SECTION ---------- */
  .viora-spotlight { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }
  @media (max-width: 860px) { .viora-spotlight { grid-template-columns: 1fr; gap: 40px; } }
  .viora-visual { border-radius: 30px; border: 1px solid var(--line); background-color: #1A1A24; background: var(--surface-2); aspect-ratio: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; box-shadow: 0 0 50px rgba(0, 0, 0, 0.4); }
  .viora-visual img { width: 85%; height: 85%; object-fit: contain; filter: drop-shadow(0 0 25px rgba(232, 36, 44, 0.2)); }
  .feature-list { margin-top: 30px; }
  .feature-row { display: flex; gap: 20px; padding: 20px 0; border-top: 1px solid var(--line); }
  .feature-icon { color: var(--red); font-weight: bold; }

  /* ---------- INTERACTIVE COMIC GALLERY ---------- */
  .comic-section { background: #0b0b11; border-bottom: 1px solid var(--line); padding: 100px 0; }
  .comic-container { display: grid; grid-template-columns: 350px 1fr; gap: 40px; margin-top: 40px; align-items: start; }
  @media (max-width: 768px) { .comic-container { grid-template-columns: 1fr; } }
  .comic-menu { display: flex; flex-direction: column; gap: 10px; }
  .comic-tab { background-color: #1A1A24; background: var(--surface-2); border: 1px solid var(--line); padding: 16px 20px; border-radius: var(--radius-md); cursor: pointer; text-align: left; font-family: 'Space Grotesk', sans-serif; font-weight: 500; color: var(--muted); transition: all 0.3s ease; display: flex; align-items: center; gap: 15px; }
  .comic-tab:hover { border-color: var(--red); color: var(--silver); }
  .comic-tab.active { background: linear-gradient(90deg, var(--red-deep) 0%, var(--surface-2) 100%); border-color: var(--red); color: white; box-shadow: 0 4px 20px rgba(232, 36, 44, 0.15); }
  .comic-tab .num { font-family: 'JetBrains Mono', monospace; font-size: 12px; opacity: 0.6; }
  
  .comic-display { background-color: #12121A; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px; display: flex; align-items: center; justify-content: center; min-height: 500px; position: relative; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4); cursor: zoom-in; }
  .comic-display::after { content: '🔍'; position: absolute; bottom: 20px; right: 20px; font-size: 20px; opacity: 0.5; transition: 0.3s; pointer-events: none; }
  .comic-display:hover::after { opacity: 1; }
  .comic-display img { max-width: 100%; max-height: 650px; object-fit: contain; border-radius: 10px; display: none; animation: fadeIn 0.4s ease forwards; }
  .comic-display img.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

  /* ---------- ARCADE VİTRİN ALANI ---------- */
  .arcade-section { background-color: #07070B; background: var(--void); border-bottom: 1px solid var(--line); padding: 100px 0; }
  .arcade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-top: 40px; }
  @media (max-width: 860px) { .arcade-grid { grid-template-columns: 1fr; } }
  
  .arcade-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; display: flex; flex-direction: column; transition: 0.3s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .arcade-card:hover { border-color: rgba(232, 36, 44, 0.4); box-shadow: 0 15px 40px rgba(232, 36, 44, 0.05); transform: translateY(-4px); }

  .card-preview-container { position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; background: #000; border-bottom: 1px solid var(--line); }
  .card-slides { display: flex; width: 200%; height: 100%; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
  
  /* RESMİ KIRPMADAN TAM VE ORİJİNAL HALİYLE ÇERÇEVEYE SIĞDIRAN CSS AYARI */
  .card-slides img { 
    width: 50%; 
    height: 100%; 
    object-fit: contain;
    object-position: center; 
    display: block;
  }
  
  .arcade-card:hover .card-slides { transform: translateX(-50%); }
  
  .card-body { padding: 30px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
  .card-info h3 { font-size: 24px; margin-bottom: 10px; color: #fff; }
